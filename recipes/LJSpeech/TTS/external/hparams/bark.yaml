seed: 74443
source: suno/bark
tts_save_path: null
data_folder: !PLACEHOLDER
model_sample_rate: 24000
output_folder: results/bark
prepare_save_folder: !ref <data_folder>/prepared
prepare_skip_ignore_folders: False
splits: ["valid", "test"]
frozen_split_path: null
