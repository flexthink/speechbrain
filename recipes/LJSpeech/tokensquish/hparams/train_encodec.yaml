# ############################################################################
# Model: Tokenized TTS (WhisperSpeech-inspired)
# Authors:  Artem Ploujnikov
# ############################################################################
# Seed needs to be set at top of yaml, before objects with parameters are made

seed: 74443
__set_seed: !apply:torch.manual_seed [!ref <seed>]
output_folder: !ref results/transformer/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

token_model_src: "facebook/encodec_24khz"
vocoder_model: "charactr/vocos-encodec-24khz"

# Data files
data_folder: !PLACEHOLDER # e.g., /path/to/LibriSpeech
prepare_save_folder: !ref <data_folder>/prepared
prepare_archive_path: null
train_json: !ref <prepare_save_folder>/train.json
valid_json: !ref <prepare_save_folder>/valid.json
test_json: !ref <prepare_save_folder>/test.json

splits: ["train", "valid", "test"]
split_ratio: [90, 5, 5]


ckpt_interval_minutes: 30 # save checkpoint every N min

# Training parameters
# To make Transformers converge, the global bath size should be large enough.
# The global batch size is computed as batch_size * n_gpus * gradient_accumulation.
# Empirically, we found that this value should be >= 128.
# Please, set your parameters accordingly.
number_of_epochs: 1000
batch_size: 16
grad_accumulation_factor: 1
max_grad_norm: 5.0
sorting: random
num_workers: 4
skip_prep: False
overfit_test: False
overfit_test_sample_count: !ref <batch_size>
overfit_test_epoch_data_count: 1000
attention_type: RelPosMHAXL


# index
pad_index: 0
bos_index: 0

# stages related parameters
lr: 0.001
lr_warmup_steps: 10000
lr_annealing_mode: step
guided_attention_weight: 50.0
guided_attention_sigma: 0.5
commitment_loss_weight: 0.1
codebook_loss_weight: 0.1

# Feature parameters
sample_rate: 22050
model_sample_rate: 24000

# Token model (pretrained)
token_model: !new:speechbrain.lobes.models.huggingface_transformers.Encodec
    source: !ref <token_model_src>
    save_path: !ref <data_folder>
    flat_embeddings: True

# Dataloader options
train_dataloader_opts:
    batch_size: !ref <batch_size>
    shuffle: True
    num_workers: !ref <num_workers>
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        padding_kwargs:
            value: !ref <pad_index>

valid_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        padding_kwargs:
            value: !ref <pad_index>

test_dataloader_opts:
    batch_size: 1
    num_workers: !ref <num_workers>
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        padding_kwargs:
            value: !ref <pad_index>

sample_dataloader_opts:
    batch_size: !ref <batch_size>
    num_workers: !ref <num_workers>
    collate_fn: !name:speechbrain.dataio.batch.PaddedBatch
        padding_kwargs:
            value: !ref <pad_index>

extract_features_opts:
    dataloader_opts:
        batch_size: !ref <batch_size>
    token_model: !ref <token_model>
    sample_rate: !ref <sample_rate>
    model_sample_rate: !ref <model_sample_rate>


####################### Model parameters ###########################
# Transformer
scale_factor: 2
d_model: 512
nhead: 4
enc_num_layers: 6
dec_num_layers: 12
d_ffn: 2048
dropout: 0.2
activation: !name:torch.nn.GELU
audio_num_tokens: 1024
audio_emb_size: 128
audio_emb_freeze: True
text_num_tokens: 31
audio_tokens_per_step: 2
interpolation_mode: linear

############################## models ################################

model: !new:speechbrain.lobes.models.discrete.tokensquish.TokenSquishModel
    num_tokens: !ref <audio_num_tokens>
    tokens_per_step: !ref <audio_tokens_per_step>
    d_model: !ref <d_model>
    d_ffn: !ref <d_ffn>
    nhead: !ref <nhead>
    enc_num_layers: !ref <enc_num_layers>
    dec_num_layers: !ref <dec_num_layers>
    dropout: !ref <dropout>
    activation: !ref <activation>
    scale_factor: !ref <scale_factor>
    attention_type: !ref <attention_type>
    interpolation_mode: !ref <interpolation_mode>

modules:
    model: !ref <model>

# define two optimizers here for two-stage training
opt_class: !name:torch.optim.Adam
    lr: !ref <lr>

compute_cost: !name:speechbrain.nnet.losses.nll_loss

compute_cost_attn: !new:speechbrain.nnet.loss.guidedattn_loss.GuidedAttentionLoss
    sigma: !ref <guided_attention_sigma>

compute_cost_codebook: !name:speechbrain.nnet.losses.mse_loss
compute_cost_commitment: !name:speechbrain.nnet.losses.mse_loss

lr_annealing: !new:speechbrain.nnet.schedulers.NoamScheduler
    lr_initial: !ref <lr>
    n_warmup_steps: !ref <lr_warmup_steps>

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        model: !ref <model>
        lr_scheduler: !ref <lr_annealing>
        counter: !ref <epoch_counter>

freezer: !new:speechbrain.dataio.preparation.Freezer
    save_path: !ref <prepare_save_folder>
    archive_path: !ref <prepare_archive_path>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>
